name: Update DFS slates

# Event-driven: a 30-min dispatcher exits in seconds unless a window is due:
#  new DraftKings salaries posted, ~2h and ~45m before each lock, overnight (~3 AM ET) and a 4-hourly daytime sweep.
on:
  schedule:
    - cron: "7,37 * * * *"
    - cron: "17 7 * * *"   # overnight anchors (GitHub throttles frequent schedules)
    - cron: "47 8 * * *"
    - cron: "23 10 * * 2"  # Tuesday ~6:23 AM ET: weekly Film Room review after Monday night (nflverse stats post overnight)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-dfs
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q numpy
      - name: Dispatch
        id: d
        env:
          FORCE_FULL: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '23 10 * * 2' }}
        run: python scripts/dispatch.py
      - name: Build slates
        if: steps.d.outputs.mode == 'full'
        run: python scripts/fetch_dfs.py
      - name: Cross-check free sources (optional)
        if: steps.d.outputs.mode == 'full'
        continue-on-error: true
        timeout-minutes: 6
        run: python scripts/ff_xcheck.py
      - name: Season guard (current season from date + same-day live roster check)
        continue-on-error: true
        run: python scripts/season_guard.py
      - name: Pre-lock lineup snapshot (append-only accountability log)
        continue-on-error: true
        run: |
          for k in thu sun mon; do [ -f data/slate_$k.json ] && node scripts/snapshot_lineups.js $k || true; done
      - name: DK-verify logged lineups (public DraftKings draftables JSON)
        continue-on-error: true
        run: python scripts/dk_verify.py || echo "::warning::Latest pre-lock lineup failed DK verification"
      - name: Grade logged lineups after games (ESPN public box score)
        continue-on-error: true
        timeout-minutes: 4
        run: python scripts/score_lineups.py
      - name: Commit if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898475+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "No data changes"; exit 0; fi
          git commit -m "Update DFS slates (${{ steps.d.outputs.why || 'state' }}) $(TZ=America/New_York date '+%Y-%m-%d %H:%M %Z')"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
