name: Nightly grading

# Overnight win/loss grading, ~3-5 AM ET. Dispatches the main "update.yml" refresh (full mode grades
# every pending pick/lineup from official box scores), waits for it, retries up to 2x on failure.
# Backup triggers at later hours only fire if no successful run has happened since 06:45 UTC today.
on:
  schedule:
    - cron: "50 7 * * *"    # 3:50 AM EDT / 2:50 AM EST  (primary)
    - cron: "50 8 * * *"    # 4:50 AM EDT / 3:50 AM EST  (backup)
    - cron: "50 9 * * *"    # 5:50 AM EDT / 4:50 AM EST  (backup)
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: nightly-grade
  cancel-in-progress: false

jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Dispatch full refresh with retry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PRIMARY: ${{ github.event.schedule == '5 7 * * *' || github.event_name == 'workflow_dispatch' }}
        run: |
          set -u
          since="$(date -u +%Y-%m-%d)T06:45:00Z"
          if [ "$PRIMARY" != "true" ]; then
            ok=$(gh run list -R "$REPO" -w update.yml -L 30 --json conclusion,createdAt,event \
                 --jq "[.[] | select(.conclusion==\"success\" and .createdAt >= \"$since\" and .event==\"workflow_dispatch\")] | length")
            if [ "${ok:-0}" -gt 0 ]; then echo "Already graded tonight ($ok successful run(s) since $since). Backup not needed."; exit 0; fi
            echo "No successful grading run since $since -> backup trigger firing."
          fi
          for attempt in 1 2 3; do
            before=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            gh workflow run update.yml -R "$REPO" 
            id=""
            for i in $(seq 1 30); do
              sleep 10
              id=$(gh run list -R "$REPO" -w update.yml -e workflow_dispatch -L 5 --json databaseId,createdAt \
                    --jq "[.[] | select(.createdAt >= \"$before\")][0].databaseId // empty")
              [ -n "$id" ] && break
            done
            if [ -z "$id" ]; then echo "attempt $attempt: run did not appear"; continue; fi
            echo "attempt $attempt: watching run $id"
            if gh run watch "$id" -R "$REPO" --exit-status --interval 30 >/dev/null; then echo "Grading run $id succeeded"; exit 0; fi
            echo "attempt $attempt: run $id failed; retrying in 60s"; sleep 60
          done
          echo "All attempts failed"; exit 1
